# Argon2id password + TOTP. Create the secret files with:  python -m waarchive.server.setup_auth
# (secrets/password_hash, secrets/totp_secret — mode 0600, never committed)
secrets:
  wa_password_hash: { file: ./secrets/password_hash }
  wa_totp_secret: { file: ./secrets/totp_secret }

services:
  app-dev: &pw
    secrets: [wa_password_hash, wa_totp_secret]
    environment:
      WA_PASSWORD_HASH_FILE: /run/secrets/wa_password_hash
      WA_TOTP_SECRET_FILE: /run/secrets/wa_totp_secret
  app: *pw
