name: test-and-security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository. Nothing here can push, comment or publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Types (mypy --strict)
        run: mypy
      - name: SAST (bandit)
        run: bandit -q -r src extract_and_ingest.py -c pyproject.toml
      - name: Tests (unit, security, API, deployment config)
        run: pytest -p no:warnings --cov=waarchive --cov-report=term-missing --cov-fail-under=90
      - name: Dependency audit (pip-audit)
        if: matrix.python == '3.13'
        run: pip-audit --skip-editable

  web:
    name: Web (typecheck, lint, unit, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: ESLint (strict, eslint-plugin-security, zero warnings)
        run: npx eslint . --max-warnings 0
      - run: npm test
      - run: npm run build
      - name: npm audit (production dependencies, fails on high/critical)
        run: npm run audit
      - name: npm audit (dev toolchain, informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    needs: [python, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e ".[dev]"
      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Playwright (builds the SPA, starts the real server with a 100,000-message chat)
        working-directory: web
        env:
          WA_PYTHON: python
        run: npm run test:e2e
      - name: Keep failure artefacts (synthetic data only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  docker:
    name: Container build, config and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Validate every compose profile and auth mode
        env:
          WA_AUTH_MODE: password_totp
          WA_DOMAIN: archive.example.com
          ACME_EMAIL: ci@example.com
        run: |
          for override in docker-compose.password.yml docker-compose.google.yml; do
            for profile in dev prod tunnel tailscale; do
              docker compose -f docker-compose.yml -f "$override" --profile "$profile" config -q
            done
          done
      - name: Build runtime image
        run: docker build --target runtime -t wa-archive:ci .
      - name: Build dev image
        run: docker build --target dev -t wa-archive:ci-dev .
      - name: Image runs as non-root and passes its health check wiring
        run: |
          test "$(docker run --rm --entrypoint id wa-archive:ci -u)" = "10001"
          docker run --rm --entrypoint python wa-archive:ci -c "import waarchive.server.app, waarchive.server.healthcheck"
      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: wa-archive:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: Scan repository config (Dockerfile, compose, workflows)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
